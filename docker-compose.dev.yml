# Overlay for local dev, applied explicitly so it never reaches the instance:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yml up -d prometheus grafana
services:
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=128MB
    volumes:
      # a mount beats the baked config, so dev gets host.docker.internal targets
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prom:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop provides this; Linux does not

  grafana:
    build:
      context: .
      dockerfile: monitoring/Dockerfile.grafana
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
