groups:
  - name: socrates
    rules:
      # Queue depth, not GPU utilisation: a decode loop pins the GPU near 100%
      # whether one row is busy or all of them.
      - alert: QueueBacklog
        expr: socrates_queue_depth > socrates_max_batch * 4
        for: 2m
        annotations:
          summary: "requests waiting far longer than the batch can drain"

      - alert: SlowTTFT
        expr: histogram_quantile(0.90, sum by (le) (rate(socrates_ttft_seconds_bucket[5m]))) > 5
        for: 5m
        annotations:
          summary: "p90 TTFT above 5s"

      - alert: ErrorRate
        expr: |
          sum(rate(socrates_requests_total{outcome!="ok"}[5m]))
            / sum(rate(socrates_requests_total[5m])) > 0.01
        for: 5m
        annotations:
          summary: "over 1% of generate calls failing"

