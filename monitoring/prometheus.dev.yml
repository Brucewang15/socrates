# Local dev: the tiers run on the host under `make dev`, not as containers, so
# they are reachable at host.docker.internal rather than by service name.
# dcgm-exporter is absent -- it needs an NVIDIA host.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: model
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: backend
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
