global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: model
    static_configs: [{ targets: ["model:8080"] }]
  - job_name: backend
    static_configs: [{ targets: ["backend:8000"] }]
  - job_name: gpu
    static_configs: [{ targets: ["dcgm-exporter:9400"] }]
