# The two GPU-host tiers. REGISTRY and IMAGE_TAG come from a .env beside this
# file; infra/prod/bootstrap.sh writes it on the instance.
#
# Weights are not here -- the container downloads them from HuggingFace into
# the `weights` volume on first boot, so a fresh instance pays that once.
#
# The benches ship inside the model image at /app/bench with no service of
# their own; they are a one-off, not something `up` should start:
#
#   docker compose stop model     # it holds the whole card
#   docker compose run --rm -v ./results:/app/bench/results \
#     model python bench/day_4/batching.py
services:
  model:
    image: ${REGISTRY:-socrates}/model:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: model/Dockerfile
    restart: unless-stopped
    environment:
      DEVICE: cuda
    volumes:
      # 8 GB of weights
      - weights:/weights
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TLS for socrates.pianofi.ca and monitoring.socrates.pianofi.ca. Certificates
  # live in the caddy volume; losing it means re-issuing against Let's Encrypt
  # rate limits.
  caddy:
    image: ${REGISTRY:-socrates}/caddy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    depends_on: [backend, grafana]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backend:
    image: ${REGISTRY:-socrates}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - model
    environment:
      MODEL_URL: http://model:8080
      # Only reachable while the bench profile is up; the benchmark refuses the
      # vllm target with a clear error rather than hanging when it is not.
      VLLM_URL: http://vllm:8100/v1
    ports:
      - "8000:8000"

  prometheus:
    image: ${REGISTRY:-socrates}/prometheus:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: monitoring/Dockerfile.prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Whichever limit is hit first wins. The size cap is the real guard:
      # retention.time alone does not bound disk if cardinality grows.
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - prom:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: ${REGISTRY:-socrates}/grafana:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: monitoring/Dockerfile.grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-socrates}
      GF_SERVER_ROOT_URL: https://monitoring.socrates.pianofi.ca/
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000"

  # vLLM as a yardstick, not part of the stack. Behind a profile so `up` never
  # starts it: it wants the whole card, and two engines sharing one L4 would
  # measure contention rather than either engine.
  #
  #   docker compose stop model
  #   docker compose --profile bench up -d vllm
  #   curl -XPOST localhost:8000/api/benchmark -d '{"target":"vllm"}'
  #   docker compose --profile bench down && docker compose start model
  #
  # infra/prod/compare-vllm.sh does that sequence and diffs the two results.
  #
  # Same weights volume and the same HF_HOME as the model tier, so it reuses the
  # 8 GB already on disk instead of downloading Qwen3-4B a second time.
  #
  # The flags exist to make the comparison fair rather than flattering. Ours is
  # 18 rows of 2048 tokens, so vLLM gets the same budget; left alone it would
  # pick a far larger batch and win on capacity we did not give ourselves.
  # VLLM_MAX_SEQS=256 unset is the "let it run free" run, which is a different
  # and also honest question -- record which one you ran.
  vllm:
    profiles: ["bench"]
    image: vllm/vllm-openai:v0.29.0
    restart: "no"
    ipc: host                      # vLLM needs a real /dev/shm for its workers
    environment:
      HF_HOME: /weights
    volumes:
      - weights:/weights
    expose:
      - "8100"
    command:
      - --model=Qwen/Qwen3-4B
      - --served-model-name=qwen3-4b
      - --port=8100
      - --max-model-len=${VLLM_MAX_LEN:-2048}
      - --max-num-seqs=${VLLM_MAX_SEQS:-18}
      - --gpu-memory-utilization=${VLLM_GPU_FRAC:-0.85}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # NVIDIA's own telemetry. nvidia-smi cannot report SM occupancy or DRAM
  # activity; DCGM reads the hardware counters.
  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.1.1-4.0.4-ubuntu22.04
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  caddy_data:
  caddy_config:
  weights:
  prom:
  grafana:
