services:
  model:
    image: ${REGISTRY:-socrates}/model:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: model/Dockerfile
    restart: unless-stopped
    environment:
      DEVICE: cuda
    volumes:
      # 8 GB of weights
      - weights:/weights
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: ${REGISTRY:-socrates}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - model
    environment:
      MODEL_URL: http://model:8080
    ports:
      - "8000:8000"

volumes:
  weights:
