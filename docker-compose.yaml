# The two GPU-host tiers. REGISTRY and IMAGE_TAG come from a .env beside this
# file; infra/prod/bootstrap.sh writes it on the instance.
#
# Weights are not here -- the container downloads them from HuggingFace into
# the `weights` volume on first boot, so a fresh instance pays that once.
#
# The benches ship inside the model image at /app/bench with no service of
# their own; they are a one-off, not something `up` should start:
#
#   docker compose stop model     # it holds the whole card
#   docker compose run --rm -v ./results:/app/bench/results \
#     model python bench/day_4/batching.py
services:
  model:
    image: ${REGISTRY:-socrates}/model:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: model/Dockerfile
    restart: unless-stopped
    environment:
      DEVICE: cuda
    volumes:
      # 8 GB of weights
      - weights:/weights
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: ${REGISTRY:-socrates}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - model
    environment:
      MODEL_URL: http://model:8080
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-socrates}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000"

  # NVIDIA's own telemetry. nvidia-smi cannot report SM occupancy or DRAM
  # activity; DCGM reads the hardware counters.
  dcgm-exporter:
    image: nvidia/dcgm-exporter:4.1.1-4.0.4-ubuntu22.04
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  weights:
  prom:
  grafana:
