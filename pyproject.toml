[project]
name = "socrates"
version = "0.1.0"
description = "LLM inference from first principles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
    "matplotlib>=3.11.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "analysis"]
